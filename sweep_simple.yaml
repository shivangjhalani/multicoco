# Simple WandB Sweep Configuration for MultiCoCo - Quick Experiments
# Run with: wandb sweep sweep_simple.yaml
# Then: wandb agent <sweep_id>

program: run.py
method: grid  # Grid search for systematic exploration
project: multicoco-research

# Define the optimization goal
metric:
  name: eval/accuracy
  goal: maximize

# Hyperparameter search space (reduced for quick experiments)
parameters:
  
  # Key CoCoNut parameters
  coconut.epochs_per_stage:
    values: [3, 5]
  
  coconut.max_latent_stage:
    values: [4, 6]

  # Critical generation parameters  
  generation.temperature:
    values: [0.7, 0.8, 1.0]

  # Essential training parameters
  learning_rate:
    values: [1e-5, 1.5e-5, 2e-5]
    
  batch_size:
    values: [8, 16]

# Fixed parameters for quick runs
command:
  - ${program}
  - --config
  - args/aokvqa_coconut.yaml
  - --limit_for_testing
  - true
  - ${args}

name: multicoco-quick-sweep
description: "Quick hyperparameter sweep for MultiCoCo CoCoNut with reduced parameter space" 
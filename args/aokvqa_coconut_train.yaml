# Training Configuration
mode: "coconut_train"
output_dir: "checkpoints/aokvqa_coconut"
num_epochs: 50
batch_size: 8
eval_batch_size: 16
learning_rate: 1.0e-5
gradient_accumulation_steps: 2
resume_from_checkpoint: false
limit_for_testing: true
reset_optimizer: True

# CoCoNuT Specific Configuration
coconut:
  enabled: true
  c_thought: 1
  epochs_per_stage: 5
  max_latent_stage: 6

# Model Configuration
model_name: "checkpoints/aokvqa_cot" # Start from a CoT-finetuned model
use_flash_attention_2: true
torch_compile: false

# Data Configuration
data_dir: "data/"
train_data_path: "data/aokvqa_train.json"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
use_wandb: false
console_output: true
verbose: false

# Evaluation Configuration (for validation during training)
eval_config:
  cot: false
  coconut: true
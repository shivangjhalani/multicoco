# Training Configuration
mode: "coconut_train"
output_dir: "checkpoints/aokvqa_coconut" # A different directory for the final model
num_epochs: 2
batch_size: 8
eval_batch_size: 16
learning_rate: 5.0e-6 # A smaller learning rate is common for the 2nd phase
gradient_accumulation_steps: 2
resume_from_checkpoint: false # This would be set to true to load the CoT model
limit_for_testing: true

# Model Configuration
model_name: "checkpoints/aokvqa_cot" # Load the model from the CoT training phase
use_flash_attention_2: true
torch_compile: false

# Data Configuration
data_dir: "data/"
train_data_path: "data/aokvqa_train_with_latent.json" # Assumes a different dataset with <latent> tokens
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
use_wandb: false
console_output: true
verbose: false

# Evaluation Configuration
eval_config:
  cot: false
  coconut: true 
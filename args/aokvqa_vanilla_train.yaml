# Configuration for training the vanilla (direct answer) model.

project: multicoco
name: aokvqa-vanilla-train
save_path: checkpoints/vanilla_train
model_id: OpenGVLab/InternVL3-1B-Pretrained # Use the pretrained model
load_model_path: null

# Staging - vanilla mode
cot: False
coconut: False
c_thought: 0
max_latent_stage: 0
epochs_per_stage: 1 # Train for one epoch

# Data
data_dir: data/
train_path: data/aokvqa_train.json # Use the training set
val_path: data/aokvqa_validation.json

# Training
batch_size_training: 8
batch_size_evaluation: 16
gradient_accumulation_steps: 2
lr: !!float 5e-5
weight_decay: 0.01
bf16: True
save_only_improve: False
reset_optimizer: False
seed: 42
debug: False
only_eval: False # We are training now
max_new_tokens: 100 
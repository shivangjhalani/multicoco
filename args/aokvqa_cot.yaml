# Stage 0: Chain-of-Thought Training

# Training Configuration
mode: "cot_train"
name: "aokvqa-cot-stage0"
output_dir: "checkpoints/aokvqa_cot"
batch_size: 16
eval_batch_size: 64
eval_accumulation_steps: 2
num_epochs: 10

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 1.0
  top_p: 0.9

# Evaluation Configuration
eval_config:
  coconut: false
  cot: true 
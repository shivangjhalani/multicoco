# Stage 0: Chain-of-Thought Training
# This is the first phase - pure CoT training similar to original CoCoNut gsm_cot.yaml

# Training Configuration
mode: "cot_train"
project: "multicoco"
name: "aokvqa-cot-stage0"
run_name: "aokvqa-cot-stage0"
output_dir: "checkpoints/aokvqa_cot"
num_epochs: 10
batch_size: 16
eval_batch_size: 16
learning_rate: 1.0e-5
gradient_accumulation_steps: 2
resume_from_checkpoint: false
limit_for_testing: false
debug: false

# Precision Configuration
bf16: true
fp16: false

# Model Configuration - Base model for Stage 0
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
use_flash_attention_2: true
torch_compile: false

# Data Configuration  
data_dir: "data/"
train_data_path: "data/aokvqa_train.json"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
console_output: true
verbose: false

# Stage 0 Evaluation - CoT only
eval_config:
  cot: true
  coconut: false 
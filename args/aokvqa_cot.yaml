# Stage 0: Chain-of-Thought Training

# Training Configuration
mode: "cot_train"
name: "aokvqa-cot-stage0"
run_name: "aokvqa-cot-stage0"
output_dir: "checkpoints/aokvqa_cot"
batch_size: 16
eval_batch_size: 64
eval_accumulation_steps: 2
num_epochs: 8  # Reduced from 10 to avoid overfitting explicit chains
weight_decay: 0.01
warmup_steps: 500
load_best_model_at_end: true
metric_for_best_model: "accuracy"

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 1.0  # Promotes diversity in reasoning chains
  top_p: 0.9
  top_k: 50  # Limits sampling to top 50 tokens

# Logging Configuration
use_wandb: true

# WandB Configuration
wandb_project: "multicoco-research"
wandb_tags: ["cot", "chain-of-thought", "aokvqa", "stage0", "baseline"]
wandb_group: "aokvqa-cot-baseline"

# Evaluation Configuration
eval_config:
  coconut: false
  cot: true 
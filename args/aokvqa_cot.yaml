# Configuration for CoT (Chain-of-Thought) training on A-OKVQA dataset
# This config uses the new structured format with proper sections

# Model Configuration
model:
  model_name: "OpenGVLab/InternVL3-1B-Pretrained"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  low_cpu_mem_usage: true

# Training Configuration
training:
  eval_only: false
  output_dir: "./output/aokvqa_cot"
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 5.0e-5
  num_epochs: 8
  gradient_accumulation_steps: 2
  warmup_steps: 200
  logging_steps: 100
  save_steps: 1000000  # Disable step-based saving
  eval_steps: 1000000  # Disable step-based evaluation  
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_accuracy"
  greater_is_better: true
  save_total_limit: 8  # Keep all epoch checkpoints
  seed: 42
  data_seed: 42
  bf16: true
  fp16: false
  dataloader_num_workers: 4
  remove_unused_columns: false

# Data Configuration
data:
  train_data_path: "./data/aokvqa_train.json"
  eval_data_path: "./data/aokvqa_validation.json"
  data_dir: "./data"
  limit_for_testing: false

# Evaluation Configuration
evaluation:
  vanilla: false
  cot: true
  coconut: false
  detailed_logging: true

# CoCoNut Configuration (disabled for CoT training)
coconut:
  enabled: false
  c_thought: 0
  max_latent_stage: 0
  epochs_per_stage: 0

# Generation Configuration
generation:
  max_new_tokens: 256
  do_sample: false
  num_beams: 1
  temperature: 1.0
  top_p: 1.0
  top_k: 50

# Logging Configuration
logging:
  log_dir: "logs/"
  log_level: "INFO"
  use_wandb: true
  console_output: true
  verbose: false 
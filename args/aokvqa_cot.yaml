# Configuration for CoT training on A-OKVQA dataset
# This config provides epoch-based training for Chain-of-Thought approach

# Project info for wandb logging  
project: multicoco
name: aokvqa-cot-epoch-training

# Model Configuration
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
torch_dtype: "bfloat16"
trust_remote_code: true
low_cpu_mem_usage: true

# Training Configuration
eval_only: false
output_dir: "output/aokvqa_cot"
batch_size: 2
eval_batch_size: 1
learning_rate: 5.0e-5
num_epochs: 5
gradient_accumulation_steps: 2
warmup_steps: 500
logging_steps: 10
save_steps: 500
eval_steps: 500
evaluation_strategy: "epoch"
save_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_accuracy"
greater_is_better: true
seed: 42
data_seed: 42
bf16: true
fp16: false
dataloader_num_workers: 4
remove_unused_columns: false

# Data Configuration
train_data_path: "data/aokvqa_train.json"
eval_data_path: "data/aokvqa_validation.json"
data_dir: "data"
limit_for_testing: false

# Evaluation Configuration
vanilla: false
cot: true
coconut: false
detailed_logging: true

# CoCoNut Configuration (disabled for CoT)
coconut: false
c_thought: 0
max_latent_stage: 0
epochs_per_stage: 1

# Generation Configuration
max_new_tokens: 256
do_sample: false
num_beams: 1
temperature: 1.0
top_p: 1.0
top_k: 50

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
use_wandb: true
console_output: true
verbose: false 
# CoT Evaluation Only

# Training Configuration
mode: "eval_only"
name: "aokvqa-cot-eval"
limit_for_testing: true

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 1.0
  top_p: 0.9

# Model Configuration
load_model_path: "checkpoints/aokvqa_cot"

# Evaluation Configuration
eval_config:
  coconut: false
  cot: true 
# Configuration for vanilla evaluation on AOKVQA dataset
model_name: 'OpenGVLab/InternVL3-1B-Pretrained'
output_dir: './output/aokvqa_vanilla_eval'

# Dataset configuration
val_data_path: './data/aokvqa_validation.json'
data_dir: './data'

# Evaluation settings
eval_only: true
eval_batch_size: 8

# Model settings
coconut: false
cot: false

# Training arguments (even though we're only evaluating)
learning_rate: 1e-5
num_epochs: 1
batch_size: 1
gradient_accumulation_steps: 1
warmup_steps: 0
logging_steps: 10
save_steps: 1000
eval_steps: 1000
eval_strategy: 'steps'
save_strategy: 'steps' 
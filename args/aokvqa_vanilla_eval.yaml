# Vanilla Evaluation Only
# For evaluating the base InternVL3-1B model without CoT or CoCoNut training
# Inherits from base.yaml with overrides

# Training Configuration
mode: "eval_only"
name: "aokvqa-vanilla-eval"
run_name: "aokvqa-vanilla-eval"
only_eval: true
limit_for_testing: true
eval_batch_size: 64

# Generation Configuration for Vanilla Evaluation
# Conservative but flexible settings for direct question answering
generation:
  max_new_tokens: 128
  do_sample: true
  temperature: 0.6
  top_p: 0.8
  num_beams: 1

# Vanilla Evaluation
eval_config:
  cot: false
  coconut: false
  vanilla: true 
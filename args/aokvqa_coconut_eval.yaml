# CoCoNut Evaluation Only

# Training Configuration
mode: "eval_only"
name: "aokvqa-coconut-evaluation"
run_name: "aokvqa-coconut-evaluation"
eval_accumulation_steps: 2  # Reduced from 4 for faster eval
eval_batch_size: 16  # Increased from 8
limit_for_testing: true
wandb_project: "multicoco-experiments"
wandb_tags: ["multimodal", "coconut", "eval"]
wandb_log_frequency: 10

# Generation Configuration
generation:
  do_sample: false  # Deterministic for fair comparison
  max_new_tokens: 256  # Allow latent reasoning space
  num_beams: 3  # Beam search improves latent accuracy
  #temperature: 0.0  # Greedy decoding
  # temperature removed - not used in greedy/beam decoding
  top_p: 1.0
  top_k: 50

# Model Configuration
load_model_path: "checkpoints/aokvqa_coconut"

# CoCoNut Configuration
coconut:
  c_thought: 1
  enabled: true
  max_latent_stage: 6

# Evaluation Configuration
eval_config:
  coconut: true
  cot: false
  detailed_logging: true
  eval_latent_tokens: 4  # Optimized: test mid-range compression 
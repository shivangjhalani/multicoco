# Evaluation Configuration
mode: "eval_only"
limit_for_testing: true

# Model Configuration
model_name: "checkpoints/aokvqa_coconut" # Assumes you are evaluating a CoCoNuT-trained model
use_flash_attention_2: true
torch_compile: false

# Data Configuration
data_dir: "data/"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
console_output: true
verbose: false

# Evaluation Mode
eval_config:
  cot: false
  coconut: true 
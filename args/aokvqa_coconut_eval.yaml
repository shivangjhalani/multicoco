# CoCoNut Evaluation Only
# For evaluating a trained CoCoNut model similar to original CoCoNut gsm_coconut_eval.yaml

# Training Configuration
mode: "eval_only"
project: "multicoco"
name: "aokvqa-coconut-eval"
limit_for_testing: true
debug: false

# Precision Configuration
bf16: true
fp16: false

# Model Configuration - Load trained CoCoNut checkpoint
load_model_path: "checkpoints/aokvqa_coconut"  # Path to best CoCoNut checkpoint
model_name: "OpenGVLab/InternVL3-1B-Pretrained"  # Base model for tokenizer/config
use_flash_attention_2: true
torch_compile: false

# Data Configuration  
data_dir: "data/"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
console_output: true
verbose: false

# CoCoNut Evaluation
eval_config:
  cot: false
  coconut: true 
# Base configuration for MultiCoCo
# This file contains common settings shared across all configurations

# Project Configuration
project: "multicoco"
debug: false
seed: 42

# Precision Configuration
bf16: true
fp16: false

# Base Model Configuration
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
use_flash_attention_2: true
torch_compile: false

# Data Configuration  
data_dir: "data/"
train_data_path: "data/aokvqa_train.json"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
console_output: true
verbose: false

# Default Training Configuration
batch_size: 8
eval_batch_size: 16
learning_rate: 1.0e-5
gradient_accumulation_steps: 2
eval_accumulation_steps: 1
resume_from_checkpoint: true
limit_for_testing: false

# Generation Configuration for Evaluation
generation:
  max_new_tokens: 256
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  num_beams: 1

# Checkpoint Management
max_checkpoints_to_keep: 10        # Maximum number of checkpoints to keep
keep_best_checkpoints: true       # Keep best checkpoints based on eval accuracy (vs most recent)
use_run_name_in_output_dir: true  # Include run name in checkpoint directory path 
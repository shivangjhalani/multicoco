# Base configuration for MultiCoCo

# Project Configuration
debug: false
project: "multi"
seed: 42

# Training Configuration
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 2
eval_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0
lr_scheduler_type: "cosine"
limit_for_testing: false
resume_from_checkpoint: true
load_best_model_at_end: true
metric_for_best_model: "accuracy"
greater_is_better: true

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 0.7
  top_p: 0.9
  top_k: 50

# Model Configuration
bf16: true
fp16: false
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
torch_compile: false
use_flash_attentPrint Debug Info: In trainer.py _train_one_epoch, add logger.info(f"Current LR: {self.get_lr()} (full float: {self.optimizer.param_groups[0]['lr']})") after each training_step. This will show if it's exactly 0 or just small.
Check Total Steps: Add print(len(self.train_dataloader), self.args.gradient_accumulation_steps, total_steps) before training. Ensure total_steps > warmup_steps.ion_2: true
# gradient_checkpointing: true
gradient_checkpointing_kwargs: {"use_reentrant": false}
dataloader_num_workers: 8

# Data Configuration
data_dir: "data/"
eval_data_path: "data/aokvqa_validation.json"
train_data_path: "data/aokvqa_train.json"

# Logging Configuration
logging:
  log_dir: "logs/"
  log_level: "INFO"
  use_wandb: true
  run_name: null
  log_to_file: true

# Checkpoint Management
keep_best_checkpoints: true
max_checkpoints_to_keep: 10
use_run_name_in_output_dir: true
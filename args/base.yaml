# Base configuration for MultiCoCo
# Common settings shared across all configurations

# Project Configuration
debug: false
project: "multicoco"
seed: 42

# Training Configuration
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 2
eval_accumulation_steps: 1
learning_rate: 1.0e-5  # Safe for fine-tuning large models
weight_decay: 0.01  # Prevents overfitting
warmup_steps: 500  # 10% of total steps for stability
limit_for_testing: false
resume_from_checkpoint: true
load_best_model_at_end: true
metric_for_best_model: "accuracy"
greater_is_better: true

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 0.7
  top_p: 0.9
  top_k: 50  # Standard constraint from LLM literature

# Model Configuration
bf16: true  # Mixed-precision speed on Ampere+ GPUs
fp16: false  # Avoid if causes instability in vision components
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
torch_compile: false
use_flash_attention_2: true
gradient_checkpointing: true  # Memory efficiency
dataloader_num_workers: 4

# Data Configuration
data_dir: "data/"
eval_data_path: "data/aokvqa_validation.json"
train_data_path: "data/aokvqa_train.json"

# Logging Configuration
log_dir: "logs/"
log_level: "INFO"
use_wandb: true
run_name: null  # Will be set by specific configs
logging:
  log_to_file: true

# Checkpoint Management
keep_best_checkpoints: true
max_checkpoints_to_keep: 10
use_run_name_in_output_dir: true 
# CoCoNut Multi-Stage Training

# Training Configuration
mode: "coconut_train"
name: "aokvqa-coconut-multistage"
run_name: "aokvqa-coconut-multistage"
output_dir: "checkpoints/aokvqa_coconut"
limit_for_testing: true
num_epochs: 24  # Optimized: 6 stages * 3 epochs + 6 buffer = 24
reset_optimizer: true
resume_from_checkpoint: false
weight_decay: 0.01
warmup_steps: 500
load_best_model_at_end: true
metric_for_best_model: "accuracy"

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 0.8  # Slightly lower than CoT for latent stability
  top_p: 0.9
  top_k: 50  # Consistent sampling constraint

# Model Configuration
load_model_path: "checkpoints/aokvqa_cot"

# Logging Configuration
use_wandb: true

# CoCoNut Configuration
coconut:
  c_thought: 1
  enabled: true
  epochs_per_stage: 3  # Reduced from 5 for efficiency in multimodal
  max_latent_stage: 6
  pad_latent_to_max: false
  uniform_prob: 0.0  # Strict progression for research clarity

# Evaluation Configuration
eval_config:
  coconut: true
  cot: false

# WandB Configuration
wandb_tags: ["coconut", "aokvqa", "latent-reasoning", "multimodal"]
wandb_group: "aokvqa-coconut-progressive"
wandb_notes: "CoCoNut progressive curriculum training for AOK-VQA with latent reasoning tokens" 
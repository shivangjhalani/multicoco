# Inherits from CoT, but changes the model path and turns off the cot flag.
model_id: "OpenGVLab/InternVL3-1B-Pretrained"
load_model_path: "multicoco/aokvqa-cot" # Load weights from the completed CoT stage
save_path: "multicoco/aokvqa-coconut"
train_path: "data/aokvqa_train.json"
val_path: "data/aokvqa_validation.json"
data_dir: "data"

# Training
lr: 1.0e-5
weight_decay: 0.05
epochs_per_stage: 1
batch_size_training: 8
batch_size_evaluation: 8
gradient_accumulation_steps: 4
warmup_steps: 100
bf16: true
cot: false # This is the key change for the Coconut stage
coconut: true # Flag for evaluation

# Logging
project: "multicoco"
name: "aokvqa-coconut"
log_dir: "logs/aokvqa-coconut" 
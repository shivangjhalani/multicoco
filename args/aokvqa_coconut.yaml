# Configuration for CoCoNut training on AOKVQA dataset
model_name: 'OpenGVLab/InternVL3-1B-Pretrained'
output_dir: './output/aokvqa_coconut'

# Dataset configuration
train_data_path: './data/aokvqa_train.json'
val_data_path: './data/aokvqa_validation.json'
data_dir: './data'

# Training settings
eval_only: false
batch_size: 2
eval_batch_size: 1

# Model settings
coconut: true
cot: false
c_thought: 0.5
max_latent_stage: 3

# Training arguments
learning_rate: 5e-5
num_epochs: 5
gradient_accumulation_steps: 2
warmup_steps: 500
logging_steps: 10
save_steps: 500
eval_steps: 500
evaluation_strategy: 'steps'
save_strategy: 'steps' 
# Complete Configuration Template for MultiCoCo
# This file shows all available configuration options

# Project Configuration
debug: false
project: "multicoco"
seed: 42

# Training Configuration  
mode: "cot_train"  # Options: "cot_train", "coconut_train", "eval_only"
name: "my-experiment"
run_name: "my-experiment-run"  # Name for wandb run
output_dir: "checkpoints/my_experiment"
batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 2
eval_accumulation_steps: 1
learning_rate: 1.0e-5
num_epochs: 10
limit_for_testing: false
resume_from_checkpoint: true
weight_decay: 0.01
warmup_steps: 500
logging_steps: 10
save_steps: 1000
eval_steps: 1000
save_total_limit: 2
max_checkpoints_to_keep: 3
keep_best_checkpoints: true
use_run_name_in_output_dir: true
load_best_model_at_end: true
metric_for_best_model: "accuracy"
greater_is_better: false

# Generation Configuration
generation:
  do_sample: true
  max_new_tokens: 256
  num_beams: 1
  temperature: 0.7
  top_p: 0.9
  top_k: 50

# Model Configuration
bf16: true
fp16: false
model_name: "OpenGVLab/InternVL3-1B-Pretrained"
config_id: null
tokenizer_id: null
image_processor_id: null
torch_dtype: "bfloat16"
trust_remote_code: true
low_cpu_mem_usage: true
load_model_path: null
torch_compile: false
use_flash_attention_2: true
gradient_checkpointing: true
dataloader_pin_memory: false
dataloader_num_workers: 4

# Data Configuration
data_dir: "data/"
train_data_path: "data/aokvqa_train.json"
eval_data_path: "data/aokvqa_validation.json"

# Logging Configuration
console_output: true
log_dir: "logs/"
log_level: "INFO"  # Options: "DEBUG", "INFO", "WARNING", "ERROR"
verbose: false
use_wandb: true
wandb_project: "multicoco-experiments"
wandb_entity: null  # Optional team/org name
wandb_tags: ["example", "experiment"]
wandb_log_frequency: 10  # Log every N steps
run_name: "my-experiment-run"

# CoCoNut Configuration
coconut:
  enabled: false
  c_thought: 1
  max_latent_stage: 6
  epochs_per_stage: 1
  uniform_prob: 0.0
  pad_latent_to_max: false
  reset_optimizer: true

# Evaluation Configuration
eval_config:
  vanilla: true
  cot: false
  coconut: false
  eval_latent_tokens: null
  detailed_logging: true 
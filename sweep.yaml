program: run.py
method: grid  # or bayes/random
metric:
  name: eval/accuracy
  goal: maximize
parameters:
  generation.temperature:
    values: [0.7, 0.8, 1.0]
  coconut.epochs_per_stage:
    values: [3, 5]
  learning_rate:
    values: [1.0e-5, 2.0e-5, 5.0e-5]
  batch_size:
    values: [4, 8, 16]
  gradient_accumulation_steps:
    values: [1, 2, 4] 